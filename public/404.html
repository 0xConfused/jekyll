<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>./jekyll</title>
    <script>
      try {
        sessionStorage.setItem('redirect', location.href);
      } catch (e) {}
      location.replace('./');
    </script>
    <meta http-equiv="refresh" content="0;URL='./'" />
  </head>
  <body style="background:#0d0d0d;color:#f0f0f0;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p>Redirecting to ./jekyll...</p>
  </body>
</html>
